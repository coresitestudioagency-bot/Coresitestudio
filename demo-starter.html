<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Template — Starter</title>
    <link rel="icon" type="image/jpeg" href="IMG_20261024_230105.jpg?v=3">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #FAFAF7; color: #111; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .badge { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; background: #fdd663; border: 2px solid #111; border-radius: 999px; padding: 0.35rem 1rem; margin-bottom: 1.5rem; box-shadow: 3px 3px 0 #111; }
        h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.1; margin-bottom: 1rem; }
        p { max-width: 480px; color: #444; line-height: 1.6; margin-bottom: 2rem; }
        .btn { display: inline-block; background: #111; color: #fff; text-decoration: none; font-weight: 700; padding: 0.9rem 2rem; border-radius: 12px; border: 3px solid #111; box-shadow: 4px 4px 0 #fdd663; transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #fdd663; }
    </style>
</head>
<body>
    <div class="badge">demo template</div>
    <h1>Your website<br>template goes here.</h1>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bloom & Petal - Premium artisan florals handcrafted with love. Fresh blooms delivered daily." />
    <meta name="theme-color" content="#F9F6F0" />
    <title>Bloom & Petal — Premium Artisan Florals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.mp4tourl.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #F9F6F0 !important;
        color: #1A2F1A;
      }
      html.dark,
      html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }

      /* Preloader Styles */
      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1A2F1A;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    visibility 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .preloader-hidden {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.05);
      }

      /* Website Curtain Reveal */
      #root {
        opacity: 0;
        transition: opacity 0.6s ease-out 0.3s;
      }

      .website-reveal #root {
        opacity: 1;
      }

      /* Curtain Reveal Animation */
      .curtain-left,
      .curtain-right {
        position: fixed;
        top: 0;
        width: 50%;
        height: 100%;
        background: #1A2F1A;
        z-index: 9997;
        transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
      }

      .curtain-left {
        left: 0;
        transform: translateX(0);
      }

      .curtain-right {
        right: 0;
        transform: translateX(0);
      }

      .website-reveal .curtain-left {
        transform: translateX(-100%);
      }

      .website-reveal .curtain-right {
        transform: translateX(100%);
      }

      .preloader-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
      }

      .preloader-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, 
          rgba(26, 47, 26, 0.4) 0%, 
          rgba(26, 47, 26, 0.2) 40%,
          rgba(26, 47, 26, 0.5) 100%);
      }

      .preloader-content {
        position: relative;
        z-index: 10;
        text-align: center;
        animation: fadeInUp 1.5s ease-out;
      }

      .brand-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .brand-icon {
        font-size: 4rem;
        animation: floatIcon 3s ease-in-out infinite;
      }

      .brand-name {
        font-family: 'Cormorant Garamond', serif;
        font-size: 4rem;
        font-weight: 600;
        font-style: italic;
        color: #F9F6F0;
        margin: 0;
        letter-spacing: -0.02em;
        animation: slideInText 1.5s ease-out 0.3s both;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      }

      .brand-tagline {
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        color: #F9F6F0;
        opacity: 0.9;
        margin: 0;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        animation: fadeInText 1.5s ease-out 0.6s both;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideInText {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInText {
        from {
          opacity: 0;
        }
        to {
          opacity: 0.7;
        }
      }

      @keyframes floatIcon {
        0%, 100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(5deg);
        }
      }

      @media (max-width: 768px) {
        .brand-icon {
          font-size: 3rem;
        }
        .brand-name {
          font-size: 2.5rem;
        }
        .brand-tagline {
          font-size: 0.875rem;
        }
      }
    </style>
    <script>
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          applyThemeToDOM("light");
        }
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {}
        });
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DNykeD3l.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BvvInEU2.css">
  </head>
  <body>
    <!-- Preloader with Video -->
    <div id="preloader" class="preloader">
      <video
        id="preloader-video"
        autoplay
        muted
        playsinline
        preload="auto"
        class="preloader-video"
      >
        <source src="https://cdn.mp4tourl.com/video/free/a03c92d3-0886-47b7-addf-a2b56109370e.webm" type="video/webm" />
      </video>
      <div class="preloader-overlay"></div>
      <div class="preloader-content">
        <div class="brand-container">
          <span class="brand-icon">🌸</span>
          <h1 class="brand-name">Bloom & Petal</h1>
          <p class="brand-tagline">Premium Artisan Florals</p>
        </div>
      </div>
    </div>

    <!-- Curtain Reveal Elements -->
    <div class="curtain-left"></div>
    <div class="curtain-right"></div>
    
    <div id="root"></div>
    <script>
      // Hide preloader after 3 seconds (shorter duration)
      window.addEventListener('load', function() {
        const preloader = document.getElementById('preloader');
        const video = document.getElementById('preloader-video');
        
        // Hide after video ends
        if (video) {
          video.addEventListener('ended', function() {
            preloader.classList.add('preloader-hidden');
            // Trigger website reveal
            document.body.classList.add('website-reveal');
            setTimeout(() => {
              preloader.style.display = 'none';
            }, 800);
          });
        }
        
        // Fallback: hide after 3 seconds (reduced from 5s)
        setTimeout(function() {
          if (preloader && !preloader.classList.contains('preloader-hidden')) {
            preloader.classList.add('preloader-hidden');
            document.body.classList.add('website-reveal');
            setTimeout(() => {
              preloader.style.display = 'none';
            }, 800);
          }
        }, 3000);
      });
    </script>
  </body>
</html>

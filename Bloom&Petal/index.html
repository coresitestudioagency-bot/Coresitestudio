<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bloom & Petal - Premium artisan florals handcrafted with love. Fresh blooms delivered daily." />
    <meta name="theme-color" content="#F9F6F0" />
    <title>Bloom & Petal — Premium Artisan Florals</title>
    <link rel="icon" type="image/jpeg" href="../IMG_20261024_230105.jpg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.mp4tourl.com" crossorigin />
    <link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&family=Inter:wght@400;500;600&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1A2F1A;
      }
      html.light,
      html.light body {
        background-color: #F9F6F0 !important;
        color: #1A2F1A;
      }
      html.dark,
      html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }

      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1A2F1A;
        transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                    visibility 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .preloader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #root {
        position: relative;
        z-index: 1;
        opacity: 0;
        width: 100%;
        overflow-x: hidden;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
      }

      .website-reveal #root {
        opacity: 1;
      }

      .curtain-left,
      .curtain-right {
        position: fixed;
        top: 0;
        width: 50%;
        height: 100%;
        background: #1A2F1A;
        z-index: 9997;
        transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1) 0.12s;
      }

      .curtain-left {
        left: 0;
        transform: translateX(0);
      }

      .curtain-right {
        right: 0;
        transform: translateX(0);
      }

      .website-reveal .curtain-left {
        transform: translateX(-100%);
      }

      .website-reveal .curtain-right {
        transform: translateX(100%);
      }

      .preloader-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transform: scale(1.08);
        transition: opacity 0.45s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .preloader-video.is-playing {
        opacity: 1;
        transform: scale(1);
      }

      .preloader-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg,
          rgba(26, 47, 26, 0.18) 0%,
          rgba(26, 47, 26, 0.08) 40%,
          rgba(26, 47, 26, 0.22) 100%);
      }

      .preloader-content {
        position: relative;
        z-index: 10;
        text-align: center;
        animation: fadeInUp 0.7s ease-out;
      }

      .brand-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .brand-icon {
        font-size: 4rem;
        animation: floatIcon 3s ease-in-out infinite;
      }

      .brand-name {
        font-family: 'Cormorant Garamond', serif;
        font-size: 4rem;
        font-weight: 600;
        font-style: italic;
        color: #F9F6F0;
        margin: 0;
        letter-spacing: -0.02em;
        animation: slideInText 0.7s ease-out 0.08s both;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      }

      .brand-tagline {
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        color: #F9F6F0;
        opacity: 0.9;
        margin: 0;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        animation: fadeInText 0.6s ease-out 0.18s both;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
      }

      .hero-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        z-index: 0;
        background: #1A2F1A;
        pointer-events: none;
      }

      .hero-bg video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        transform: none;
        opacity: 1;
        filter: none;
      }

      .website-reveal .hero-bg {
        display: none;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideInText {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInText {
        from { opacity: 0; }
        to { opacity: 0.9; }
      }

      @keyframes floatIcon {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(5deg); }
      }

      @media (max-width: 768px) {
        .brand-icon { font-size: 3rem; }
        .brand-name { font-size: 2.5rem; }
        .brand-tagline { font-size: 0.875rem; }
      }
    </style>
    <script>
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          applyThemeToDOM("light");
        }
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="preloader" class="preloader">
      <video
        id="preloader-video"
        autoplay
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        class="preloader-video"
      >
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260703_053131_1ec3dd1c-d627-44fb-ab20-6e1fce41b0d5.mp4" type="video/mp4" />
      </video>
      <div class="preloader-overlay"></div>
      <div class="preloader-content">
        <div class="brand-container">
          <span class="brand-icon">🌸</span>
          <h1 class="brand-name">Bloom & Petal</h1>
          <p class="brand-tagline">Premium Artisan Florals</p>
        </div>
      </div>
    </div>

    <div class="curtain-left"></div>
    <div class="curtain-right"></div>

    <div class="hero-bg" aria-hidden="true">
      <video
        id="hero-video"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
      >
        <source src="https://cdn.mp4tourl.com/video/free/eaf960b3-7ce2-4e54-9163-29a6c872471b.webm" type="video/webm" />
      </video>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var preloader = document.getElementById('preloader');
        var intro = document.getElementById('preloader-video');
        var hero = document.getElementById('hero-video');
        var hidden = false;
        var introPlaying = false;

        function kick(video) {
          if (!video) return;
          video.muted = true;
          video.defaultMuted = true;
          video.playsInline = true;
          var p = video.play();
          if (p && p.catch) p.catch(function () {});
        }

        function hidePreloader() {
          if (hidden || !preloader) return;
          hidden = true;
          preloader.classList.add('preloader-hidden');
          document.body.classList.add('website-reveal');
          kick(hero);
          setTimeout(function () {
            preloader.style.display = 'none';
            var heroWrap = document.querySelector('.hero-bg');
            if (heroWrap) heroWrap.style.display = 'none';
            if (hero) {
              hero.pause();
              hero.removeAttribute('src');
              hero.querySelectorAll('source').forEach(function (s) { s.remove(); });
              hero.load();
            }
            if (intro) {
              intro.pause();
              intro.removeAttribute('src');
              intro.querySelectorAll('source').forEach(function (s) { s.remove(); });
              intro.load();
            }
          }, 750);
        }

        function onIntroReady() {
          if (introPlaying) return;
          introPlaying = true;
          if (intro) intro.classList.add('is-playing');
          setTimeout(hidePreloader, 2200);
        }

        kick(intro);
        kick(hero);

        if (intro) {
          intro.addEventListener('playing', onIntroReady);
          intro.addEventListener('canplay', function () {
            intro.classList.add('is-playing');
            kick(intro);
          });
          intro.addEventListener('ended', hidePreloader);
          intro.addEventListener('error', function () {
            intro.classList.add('is-playing');
            setTimeout(hidePreloader, 900);
          });
        } else {
          setTimeout(hidePreloader, 900);
        }

        setTimeout(hidePreloader, 3200);
      })();
    </script>
  </body>
</html>
